name: Post-session ingestion

on:
  schedule:
    # Check hourly for staged race-weekend retries, then retry once daily until Friday.
    - cron: "17 * * * 5,6,0"
    # 16:00 UTC Sunday-Wednesday is 00:00 Monday-Thursday in Singapore.
    - cron: "0 16 * * 0-3"
  workflow_dispatch:
    inputs:
      year:
        description: "Season to inspect (defaults to the current UTC year)"
        required: false
        type: string

concurrency:
  group: pitwall-post-session-ingestion
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_ingest: ${{ steps.session.outputs.should_ingest }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
      INGESTION_YEAR: ${{ inputs.year || '' }}
    steps:
      - name: Check for a newly completed session
        id: session
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_ingest=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested; continuing to ingestion."
            exit 0
          fi

          if [ "$EVENT_SCHEDULE" = "0 16 * * 0-3" ]; then
            echo "should_ingest=true" >> "$GITHUB_OUTPUT"
            echo "Daily catch-up requested; retrying incomplete weekend sessions."
            exit 0
          fi

          year="${INGESTION_YEAR:-$(date -u +%Y)}"
          if ! sessions="$(curl --fail --silent --show-error \
            "https://api.openf1.org/v1/sessions?year=$year")"; then
            echo "should_ingest=false" >> "$GITHUB_OUTPUT"
            echo "OpenF1 catalogue is unavailable or still in its live-session window."
            exit 0
          fi

          now="$(date -u +%s)"
          while IFS=$'\t' read -r session_key date_end; do
            [ -n "$session_key" ] && [ -n "$date_end" ] || continue
            ended="$(date -u -d "$date_end" +%s 2>/dev/null)" || continue
            age_seconds="$((now - ended))"
            if { [ "$age_seconds" -ge 7200 ] && [ "$age_seconds" -lt 10800 ]; } || \
               { [ "$age_seconds" -ge 18000 ] && [ "$age_seconds" -lt 21600 ]; } || \
               { [ "$age_seconds" -ge 36000 ] && [ "$age_seconds" -lt 39600 ]; }; then
              echo "should_ingest=true" >> "$GITHUB_OUTPUT"
              echo "Session $session_key ended within the ingestion window."
              exit 0
            fi
          done < <(printf '%s' "$sessions" | jq -r '.[] | [.session_key, .date_end] | @tsv')

          echo "should_ingest=false" >> "$GITHUB_OUTPUT"
          echo "No session is in the 2-hour, 5-hour, or 10-hour retry window."

  ingest:
    needs: detect
    if: needs.detect.outputs.should_ingest == 'true'
    # Ubuntu runners use Azure addresses that Formula 1's archive rejects. GitHub's
    # hosted macOS runners use a separate network and keep ingestion cloud-only.
    runs-on: macos-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: redis://127.0.0.1:6379/0
      STORAGE_BACKEND: s3
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PREFIX: pitwall
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      STORAGE_CACHE_MAX_BYTES: "268435456"
      FASTF1_CLEANUP_AFTER_PREPARE: "true"
      FASTF1_USE_REQUESTS_CACHE: "false"
      PERSIST_HISTORICAL_EVENTS_IN_DATABASE: "false"
      OPENF1_MIN_REQUEST_INTERVAL_SECONDS: "2.1"
      PITWALL_ADMIN_TOKEN: ${{ secrets.PITWALL_ADMIN_TOKEN }}
      INGESTION_YEAR: ${{ inputs.year || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Verify Formula 1 archive access
        run: |
          year="${INGESTION_YEAR:-$(date -u +%Y)}"
          archive_url="https://livetiming.formula1.com/static/$year/Index.json"
          archive_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$archive_url")"
          echo "Formula 1 archive status: $archive_status"
          if [ "$archive_status" != "200" ]; then
            echo "The hosted runner cannot access $archive_url"
            exit 1
          fi
      - name: Start Redis
        run: |
          brew install redis
          redis-server --daemonize yes
          for attempt in {1..30}; do
            redis-cli ping | grep -q PONG && exit 0
            sleep 1
          done
          exit 1
      - run: pip install -e .
      - run: alembic upgrade head
      - name: Start ingestion API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/pitwall-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat /tmp/pitwall-api.log
          exit 1
      - name: Enforce free cloud-storage budget
        run: python -m scripts.cloud_preflight --max-storage-gb 9.5
      - name: Ingest newly completed sessions
        run: |
          year="${INGESTION_YEAR:-$(date -u +%Y)}"
          python -m scripts.prepare_catalogue \
            --years "$year" \
            --recent-days 30 \
            --completion-delay-minutes 120 \
            --admin-token "$PITWALL_ADMIN_TOKEN" \
            --catalog-retry-attempts 4 \
            --retry-attempts 0
      - name: Verify cloud state
        if: always()
        run: python -m scripts.cloud_preflight
      - name: Show backend log on failure
        if: failure()
        run: cat /tmp/pitwall-api.log
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historical-ingestion-api-log
          path: /tmp/pitwall-api.log
          retention-days: 7
