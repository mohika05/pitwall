name: Historical ingestion

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Season to inspect (defaults to the current UTC year)"
        required: false
        type: string

concurrency:
  group: pitwall-historical-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: redis://127.0.0.1:6379/0
      STORAGE_BACKEND: s3
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_PREFIX: pitwall
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_REGION: auto
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      STORAGE_CACHE_MAX_BYTES: "268435456"
      FASTF1_CLEANUP_AFTER_PREPARE: "true"
      FASTF1_USE_REQUESTS_CACHE: "false"
      PERSIST_HISTORICAL_EVENTS_IN_DATABASE: "false"
      OPENF1_MIN_REQUEST_INTERVAL_SECONDS: "2.1"
      INGESTION_YEAR: ${{ inputs.year || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e .
      - run: alembic upgrade head
      - name: Start ingestion API
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/pitwall-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          cat /tmp/pitwall-api.log
          exit 1
      - name: Ingest newly completed sessions
        run: |
          year="${INGESTION_YEAR:-$(date -u +%Y)}"
          python -m scripts.prepare_catalogue \
            --years "$year" \
            --recent-days 30 \
            --completion-delay-minutes 120 \
            --retry-attempts 2
      - name: Verify cloud state
        if: always()
        run: python -m scripts.cloud_preflight
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: historical-ingestion-api-log
          path: /tmp/pitwall-api.log
          retention-days: 7
